name: scalermind

x-api-service: &api-service
  image: scalermind-api:local
  build:
    context: ./apps/api
    dockerfile: Dockerfile
  environment: &app-environment
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scalermind}:${POSTGRES_PASSWORD:-local_development_only}@db:5432/${POSTGRES_DB:-scalermind}
    REDIS_URL: redis://redis:6379/0
    APP_ENV: ${APP_ENV:-development}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    SECURE_AUTH_COOKIES: ${SECURE_AUTH_COOKIES:-false}
    SEED_LEARNER_PASSWORD: ${SEED_LEARNER_PASSWORD:-}
    SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  depends_on: &app-dependencies
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalermind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_DB: ${POSTGRES_DB:-scalermind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *api-service
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    <<: *api-service
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--hostname=worker@%h"]
    volumes:
      - ./apps/api:/app
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A app.worker.celery_app:celery_app inspect ping --timeout=3
          | python -c "import sys; sys.exit(0 if 'pong' in sys.stdin.read().lower() else 1)"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    init: true

volumes:
  postgres_data:
  web_node_modules:
